name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes binutils clang file

      - name: Install mini-re
        run: python -m pip install --upgrade pip -e .

      - name: Run offline suite
        run: python -m unittest discover -s tests -v

  complex-project-cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure multi-file C++ fixture
        run: cmake -S examples/complex_project -B build/complex-project

      - name: Build static library, CLI, and tests
        run: cmake --build build/complex-project --parallel

      - name: Run CTest gate
        run: ctest --test-dir build/complex-project --output-on-failure
